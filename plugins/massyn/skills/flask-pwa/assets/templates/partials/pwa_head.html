{# Include inside <head>. The viewport meta replaces base.html's own: viewport-fit=cover lets the
   page reach under the iPhone notch and home indicator, and env(safe-area-inset-*) pads it back. #}
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
{# Keep in step with theme_color in static/manifest.json. #}
<meta name="theme-color" content="#212529">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pwa.css') }}">
