{# Shared confirmation for any <form data-confirm="Question?">; see static/js/confirm.js. #}
<div class="modal fade pwa-sheet" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-message" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body" id="confirm-message"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirm-ok">OK</button>
      </div>
    </div>
  </div>
</div>
