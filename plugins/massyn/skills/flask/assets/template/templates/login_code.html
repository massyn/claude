{% extends "base.html" %}

{% block title %}Enter your code{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-3">📬 Check your email</h4>
                <p class="text-muted">
                    If <strong>{{ email }}</strong> can sign in here, we've sent it a {{ code_length }}-digit code.
                    It works once and expires shortly.
                </p>
                <form method="post" action="{{ url_for('auth.login_code') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <label class="form-label" for="code">Sign-in code</label>
                    <input type="text" class="form-control form-control-lg text-center mb-3" id="code" name="code"
                           required autofocus autocomplete="one-time-code" inputmode="numeric"
                           pattern="[0-9 \-]*" maxlength="{{ code_length + 2 }}" style="letter-spacing: 0.4em;">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
                </form>
                <form method="post" action="{{ url_for('auth.login_code_resend') }}" class="mt-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-link p-0">Send a new code</button>
                    <span class="text-muted">·</span>
                    <a href="{{ url_for('auth.login') }}">Use a different email</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
